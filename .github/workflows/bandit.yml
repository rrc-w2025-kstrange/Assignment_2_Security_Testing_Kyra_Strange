name: Bandit Security Scan

on:
  push:           # runs on any push
  pull_request:   # runs on PRs too

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        run: bandit -r .
